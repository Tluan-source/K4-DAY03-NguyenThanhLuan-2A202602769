<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Internship Assistant — Demo</title>
<style>
  :root {
    --bg: #f5f6fb;
    --panel: #ffffff;
    --panel-2: #f0f2f9;
    --border: #dfe2ee;
    --text: #1c2033;
    --muted: #6b7189;
    --accent: #4a5bd4;
    --accent-2: #128a63;
    --user-bubble: #e2e6ff;
    --ai-bubble: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { margin: 0; font-size: 17px; }
  header p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }

  .modes {
    display: flex;
    gap: 8px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
    align-items: center;
  }
  .mode-pill {
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    user-select: none;
  }
  .mode-pill.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .mode-pill.compare { border-color: var(--accent-2); color: var(--accent-2); }
  .mode-pill.compare.active { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
  }
  .samples { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .sample-chip {
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px dashed var(--border);
    color: var(--muted);
    background: var(--panel-2);
    cursor: pointer;
  }
  .sample-chip:hover { border-color: var(--accent); color: var(--accent); }
  #clearBtn {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
  }
  #clearBtn:hover { color: #c0392b; border-color: #c0392b; }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-end; }
  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .bubble.user { background: var(--user-bubble); border-bottom-right-radius: 4px; }
  .bubble.ai { background: var(--ai-bubble); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
  .ai-label {
    display: inline-block;
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 4px;
    font-weight: 600;
  }
  .latency-badge {
    font-size: 10px;
    color: var(--muted);
    margin-left: 6px;
    font-weight: 400;
  }

  details.trace {
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  details.trace summary { cursor: pointer; color: var(--accent-2); margin-bottom: 4px; }
  .trace-step {
    margin: 6px 0;
    padding: 6px 8px;
    background: var(--panel-2);
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .trace-step.final { border-color: var(--accent-2); }
  .trace-step .step-head { font-weight: 600; color: var(--text); margin-bottom: 3px; }
  .trace-step .step-line { margin: 2px 0; }
  .trace-step b { color: var(--text); }
  .trace-step code {
    background: var(--panel);
    padding: 1px 4px;
    border-radius: 4px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 11px;
    word-break: break-word;
  }

  .compare-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 10px;
    width: 100%;
  }
  .compare-card {
    background: var(--ai-bubble);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
  }
  .compare-card .ai-label { display: block; }

  .loading { color: var(--muted); font-size: 13px; font-style: italic; }

  footer {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    gap: 10px;
  }
  #messageInput {
    flex: 1;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 14px;
  }
  #sendBtn {
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  #sendBtn:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <h1>🎓 AI Internship Assistant — Demo So Sánh 4 Chế Độ AI</h1>
  <p>Chatbot Base vs Chatbot API vs MCP ReAct Agent (Mock/API thật)</p>
</header>

<div class="modes" id="modeBar">
  <!-- mode pills injected by JS, mỗi pill có luồng chat riêng -->
</div>

<div class="toolbar" id="toolbar">
  <div class="samples" id="sampleChips"><!-- câu hỏi mẫu từ config/test_cases.json --></div>
  <button id="clearBtn" title="Xoá hội thoại của chế độ đang xem">🗑 Xoá hội thoại</button>
</div>

<main id="chatLog"></main>

<footer>
  <input id="messageInput" type="text" placeholder="Nhập câu hỏi, ví dụ: Cho tôi xem hồ sơ học vụ của sinh viên SV2026001" />
  <button id="sendBtn">Gửi</button>
</footer>

<script>
// Mỗi tab (4 mode + "So sánh cả 4") có mảng lịch sử riêng, không trộn lẫn.
const TABS = Object.assign({}, {{ modes | tojson }}, { compare: "⚖️ So sánh cả 4" });
const histories = {};
Object.keys(TABS).forEach(key => { histories[key] = []; });

let currentTab = "mcp_api";

const modeBar = document.getElementById("modeBar");
const chatLog = document.getElementById("chatLog");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

function renderModePills() {
  Object.entries(TABS).forEach(([key, label]) => {
    const pill = document.createElement("div");
    pill.className = "mode-pill" + (key === "compare" ? " compare" : "") + (key === currentTab ? " active" : "");
    pill.textContent = label;
    pill.dataset.mode = key;
    pill.onclick = () => {
      currentTab = key;
      modeBar.querySelectorAll(".mode-pill").forEach(p => p.classList.toggle("active", p.dataset.mode === currentTab));
      renderChatLog();
    };
    modeBar.appendChild(pill);
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function renderTrace(trace) {
  if (!trace || trace.length === 0) return "";
  const stepsHtml = trace.map(step => {
    const latency = step.latency_ms != null ? `<div class="step-line latency-badge">⏱ ${step.latency_ms} ms</div>` : "";
    if (step.action_type === "TOOL_EXECUTION") {
      return `<div class="trace-step">
        <div class="step-head">Bước ${step.step}</div>
        <div class="step-line">🛠️ <b>Action:</b> <code>${escapeHtml(step.tool_name)}(${escapeHtml(JSON.stringify(step.arguments))})</code></div>
        <div class="step-line">👁️ <b>Observation:</b> <code>${escapeHtml(JSON.stringify(step.observation))}</code></div>
        ${latency}
      </div>`;
    }
    return `<div class="trace-step final">
      <div class="step-head">Bước ${step.step} · Kết luận</div>
      <div class="step-line">🧠 <b>Thought:</b> ${escapeHtml(step.thought || "")}</div>
      <div class="step-line">🏁 <b>Final Answer:</b> ${escapeHtml(step.output || "")}</div>
      ${latency}
    </div>`;
  }).join("");
  return `<details class="trace" open><summary>📜 Trace log — ${trace.length} bước (Thought → Action → Observation)</summary>${stepsHtml}</details>`;
}

function latencyBadge(result) {
  if (!result.trace || result.trace.length === 0) return "";
  const ms = result.total_latency_ms != null ? result.total_latency_ms : 0;
  return `<span class="latency-badge">⏱ ${ms} ms · ${result.trace.length} bước</span>`;
}

function buildUserRow(text) {
  const row = document.createElement("div");
  row.className = "msg-row user";
  row.innerHTML = `<div class="bubble user"></div>`;
  row.querySelector(".bubble").textContent = text;
  return row;
}

function buildAiRow(result) {
  const row = document.createElement("div");
  row.className = "msg-row ai";
  const bubble = document.createElement("div");
  bubble.className = "bubble ai";
  bubble.innerHTML = `<span class="ai-label">${escapeHtml(result.label)}${latencyBadge(result)}</span><div>${escapeHtml(result.answer)}</div>${renderTrace(result.trace)}`;
  row.appendChild(bubble);
  return row;
}

function buildCompareRow(resultsByMode) {
  const row = document.createElement("div");
  row.className = "msg-row ai";
  const wrap = document.createElement("div");
  wrap.style.width = "100%";
  wrap.innerHTML = `<span class="ai-label">⚖️ So sánh cả 4 chế độ</span>`;
  const grid = document.createElement("div");
  grid.className = "compare-grid";
  resultsByMode.forEach(r => {
    const card = document.createElement("div");
    card.className = "compare-card";
    card.innerHTML = `<span class="ai-label">${escapeHtml(r.label)}${latencyBadge(r)}</span><div>${escapeHtml(r.answer)}</div>${renderTrace(r.trace)}`;
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  row.appendChild(wrap);
  return row;
}

function buildEntryRow(entry) {
  if (entry.type === "user") return buildUserRow(entry.text);
  if (entry.type === "compare") return buildCompareRow(entry.results);
  return buildAiRow(entry.result);
}

function renderChatLog() {
  chatLog.innerHTML = "";
  histories[currentTab].forEach(entry => chatLog.appendChild(buildEntryRow(entry)));
  chatLog.scrollTop = chatLog.scrollHeight;
}

function addLoadingRow() {
  const row = document.createElement("div");
  row.className = "msg-row ai loading-row";
  row.innerHTML = `<div class="bubble ai loading">Đang xử lý...</div>`;
  chatLog.appendChild(row);
  chatLog.scrollTop = chatLog.scrollHeight;
  return row;
}

async function sendMessage() {
  const text = messageInput.value.trim();
  if (!text) return;
  const tab = currentTab;
  messageInput.value = "";
  sendBtn.disabled = true;

  histories[tab].push({ type: "user", text });
  renderChatLog();
  const loadingRow = addLoadingRow();

  try {
    const endpoint = tab === "compare" ? "/api/compare" : "/api/chat";
    const payload = tab === "compare" ? { message: text } : { message: text, mode: tab };
    const res = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.error) {
      histories[tab].push({ type: "ai", result: { label: "Lỗi", answer: data.error, trace: [] } });
    } else if (tab === "compare") {
      histories[tab].push({ type: "compare", results: data.results });
    } else {
      histories[tab].push({ type: "ai", result: data });
    }
  } catch (e) {
    histories[tab].push({ type: "ai", result: { label: "Lỗi", answer: String(e), trace: [] } });
  } finally {
    loadingRow.remove();
    sendBtn.disabled = false;
    if (tab === currentTab) renderChatLog();
  }
}

async function loadSamples() {
  try {
    const res = await fetch("/api/samples");
    const data = await res.json();
    const box = document.getElementById("sampleChips");
    (data.samples || []).forEach(s => {
      const chip = document.createElement("div");
      chip.className = "sample-chip";
      chip.textContent = `${s.id}: ${s.question}`;
      chip.title = s.question;
      chip.onclick = () => { messageInput.value = s.question; messageInput.focus(); };
      box.appendChild(chip);
    });
  } catch (e) {
    // Câu hỏi mẫu chỉ là tiện ích phụ, lỗi thì bỏ qua, không chặn app.
  }
}

document.getElementById("clearBtn").onclick = () => {
  histories[currentTab] = [];
  renderChatLog();
};

sendBtn.onclick = sendMessage;
messageInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});

renderModePills();
renderChatLog();
loadSamples();
</script>
</body>
</html>
